  tests:
    name: Meteor 3.4 architecture and coverage gates
    runs-on: ubuntu-latest
    steps:

      # CHECKOUTS
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout leaonline:testing repo
        uses: actions/checkout@v4
        with:
          repository: leaonline/testing
          path: github/testing

      - name: Checkout leaonline:utils repo
        uses: actions/checkout@v4
        with:
          repository: leaonline/utils
          path: github/utils

      - name: Checkout leaonline:corelib repo
        uses: actions/checkout@v4
        with:
          repository: leaonline/corelib
          path: github/corelib

      - name: Checkout leaonline:ui repo
        uses: actions/checkout@v4
        with:
          repository: leaonline/ui
          path: github/ui

      - name: Checkout leaonline:service-registry repo
        uses: actions/checkout@v4
        with:
          repository: leaonline/service-registry
          path: github/service-registry

      - name: Checkout leaonline:theme repo
        uses: actions/checkout@v4
        with:
          repository: leaonline/theme
          path: github/theme

      # CACHING
      - name: Install Meteor
        id: cache-meteor-install
        uses: actions/cache@v4
        with:
          path: ~/.meteor
          key: v3-meteor-${{ hashFiles('.meteor/versions') }}
          restore-keys: |
                v3-meteor-

      - name: Cache NPM dependencies
        id: cache-meteor-npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: v3-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
                v3-npm-

      - name: Cache Meteor build
        id: cache-meteor-build
        uses: actions/cache@v4
        with:
          path: |
            .meteor/local/resolver-result-cache.json
            .meteor/local/plugin-cache
            .meteor/local/isopacks
            .meteor/local/bundler-cache/scanner
          key: v3-meteor_build_cache-${{ github.ref }}-${{ github.sha }}
          restore-key: |
            v3-meteor_build_cache-

      - name: Setup meteor
        uses: meteorengineer/setup-meteor@v1
        with:
          meteor-release: '3.4'

      - name: Install NPM Dependencies
        run: meteor npm ci

      - name: Run server architecture
        run: ./test.sh -a server -o

      - name: Run client architecture
        run: ./test.sh -a client -o

      - name: Run deterministic full-app safety net
        run: ./test.sh -f -o

      - name: Run combined suite and coverage gates
        run: ./test.sh -c -o

      - name: Upload test and coverage inventories
        uses: actions/upload-artifact@v4
        with:
          name: test-evidence
          include-hidden-files: true
          if-no-files-found: error
          path: |
            .coverage/
            .test-results/

  coverage:
    name: Coverage report
    runs-on: ubuntu-latest
    needs: [tests]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download test evidence
        uses: actions/download-artifact@v4
        with:
          name: test-evidence

      - name: Verify production metrics and source inventory
        run: node scripts/check-coverage.mjs
