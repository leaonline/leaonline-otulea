<template name="internal">
    <div class="container">
        {{#onComplete complete=dependenciesComplete}}
            {{#unless currentUser}}
                {{> login}}
            {{else}}
                <div class="d-flex justify-content-between align-items-center py-2 my-2">
                    <h1 class="border-bottom flex-grow-1">{{i18n "internal.title"}}</h1>
                    <div class="nav nav-tabs">
                        {{#each entry in views}}
                            <div class="nav-item">
                                <button class="internal-view nav-link {{#if view entry.name}}active{{/if}}" data-view="{{entry.name}}">{{i18n entry.label}}</button>
                            </div>
                        {{/each}}
                    </div>
                </div>
            {{/unless}}
            {{#if error}}
                <div class="alert alert-danger">
                    {{error.message}}
                </div>
            {{/if}}

            {{#if view}}
                {{> Template.dynamic template=template }}
            {{/if}}
        {{/onComplete}}
    </div>
</template>
