<template name="internal">
  <div class="container">
    {{#onComplete complete=dependenciesComplete}}
      {{#unless currentUser}}
        <h1>Login for Internal</h1>
        {{> login}}
      {{else}}
        <h1>{{i18n "internal.title"}}</h1>
        <div class="">
          <div class="d-flex align-items-baseline">
            <select class="form-control" id="typeSelect">
              <option value="unitSet" selected>Unit-Set</option>
              <option value="unit">Unit</option>
              <option value="testCycle">Test-Cycle</option>
            </select>
            <select class="form-control" id="fieldSelect">
              <option value="code" selected>Short-Code (lea id)</option>
              <option value="_id">Document _id</option>
            </select>
            <input type="text" placeholder="{{i18n "internal.enterValue"}}" class="form-control me-2" id="unitInput" />
            <button class="ms-1 ml-1 btn btn-primary mb-2 no-wrap" id="unitSearchButton">
              {{i18n "internal.load"}}
            </button>
          </div>
        </div>

        {{#if error}}
          <div class="alert alert-danger">
            {{error.message}}
          </div>
        {{/if}}

        {{#if unitSetDoc}}
          <div class="d-flex">
            {{#each unit in unitDocs}}
              <button class="unit-btn btn btn-sm btn-{{#unless currentUnit unit}}outline-{{/unless}}secondary" data-index="{{@index}}">
                {{unit.shortCode}}
              </button>
            {{/each}}
          </div>
        {{/if}}

        {{#if unitDoc}}
          {{> taskPageRenderer pageContentData}}
        {{/if}}
      {{/unless}}
    {{/onComplete}}
  </div>
</template>
